name: Agente Kavroo

on:
  schedule:
    - cron: '0 10 * * 1'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  agente:
    runs-on: ubuntu-latest
    steps:
      - name: Rodar agente Claude
        uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          trigger_phrase: "@claude"
          mode: "autonomous"
          model: "claude-sonnet-4-5"
