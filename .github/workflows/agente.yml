name: Agente Kavroo

on:
  schedule:
    - cron: '0 10 * * 1'  # toda segunda-feira às 10h UTC
  workflow_dispatch:       # permite rodar manualmente

jobs:
  agente:
    runs-on: ubuntu-latest
    steps:
      - name: Rodar agente Claude
        uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Você é um agente da loja Kavroo no Shopify.
            Verifique se há produtos com variações sem cor configurada
            e corrija os nomes das opções para "Color" e "Size".
